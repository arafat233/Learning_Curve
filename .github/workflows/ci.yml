name: ci
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:

permissions:
  contents: write
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node --check main.js && node --check preload.js
      - run: npm run lint
      - run: npm test
      - run: npm run dist
      - run: Compress-Archive -Path "dist/AI Interview-win32-x64" -DestinationPath ai-interview-win-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: ai-interview-win-x64, path: ai-interview-win-x64.zip }
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" ai-interview-win-x64.zip --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
